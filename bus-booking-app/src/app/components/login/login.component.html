<div class="min-vh-100 d-flex align-items-center justify-content-center bg-dark">
  <div class="card shadow-lg" style="width: 420px;">

    <div class="card-header bg-dark text-center py-4">
      <div style="font-size:3rem;">🚌</div>
      <h3 class="text-warning fw-bold mb-0">BusBooker</h3>
      <p class="text-secondary small mb-0">Your journey starts here</p>
    </div>

    <div class="card-body p-4">

      <!-- STEP 1: JWT Login -->
      <div *ngIf="step === 1">
        <h5 class="fw-bold mb-3">Sign In</h5>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-uppercase text-muted">Username</label>
          <input [(ngModel)]="username" type="text" class="form-control"
                 placeholder="Enter username" (keyup.enter)="onJwtLogin()" />
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-uppercase text-muted">Password</label>
          <input [(ngModel)]="password" type="password" class="form-control"
                 placeholder="Enter password" (keyup.enter)="onJwtLogin()" />
        </div>

        <div class="alert alert-danger py-2 small" *ngIf="error">{{ error }}</div>

        <button class="btn btn-dark w-100 fw-bold" (click)="onJwtLogin()" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

        <div class="mt-3 p-2 bg-light rounded small text-muted text-center">
          <!-- <strong>Admin:</strong> admin / admin123 &nbsp;|&nbsp;
          <strong>User:</strong> rahul / user123 -->
        </div>
      </div>

      <!-- STEP 2: Bus Customer Login -->
      <div *ngIf="step === 2">
        <h5 class="fw-bold mb-1">Verify Your Identity</h5>
        <p class="text-muted small mb-3">Enter your registered name and phone number</p>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-uppercase text-muted">Full Name</label>
          <input [(ngModel)]="custName" type="text" class="form-control"
                 placeholder="e.g. Rahul Sharma" (keyup.enter)="onBusLogin()" />
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold text-uppercase text-muted">Phone Number</label>
          <input [(ngModel)]="phoneNo" type="text" class="form-control"
                 placeholder="e.g. 9876543210" (keyup.enter)="onBusLogin()" />
        </div>

        <div class="alert alert-danger py-2 small" *ngIf="error">{{ error }}</div>

        <button class="btn btn-dark w-100 fw-bold mb-2" (click)="onBusLogin()" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Verifying...' : 'Continue' }}
        </button>

        <button class="btn btn-outline-secondary w-100" (click)="step=1; error=''">
          ← Back
        </button>
      </div>

    </div>
  </div>
</div>
