<div class="page-container">

  <div class="mb-4">
    <a routerLink="/search" class="text-decoration-none text-muted small">← Back to Search</a>
    <h3 class="fw-bold mt-2">Book Your Seats</h3>
    <p class="text-muted small">Schedule ID: #{{ scheduleId }}</p>
  </div>

  <!-- Success -->
  <div class="card shadow-sm text-center p-5" *ngIf="success">
    <div style="font-size:3rem;">✅</div>
    <h4 class="text-success fw-bold mt-3">Booking Confirmed!</h4>
    <p class="text-muted">Your Booking ID is <strong>#{{ bookingId }}</strong></p>
    <div class="d-flex gap-2 justify-content-center mt-3">
      <button class="btn btn-dark fw-bold" routerLink="/my-bookings">View My Bookings</button>
      <button class="btn btn-outline-dark" routerLink="/search">Search More</button>
    </div>
  </div>

  <!-- Booking Form -->
  <div *ngIf="!success">

    <div class="card shadow-sm mb-3" *ngFor="let p of passengers; let i = index"
         style="border-left: 4px solid #ffc107;">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold mb-0">Passenger {{ i + 1 }}</h6>
          <button class="btn btn-outline-danger btn-sm"
                  *ngIf="passengers.length > 1"
                  (click)="removePassenger(i)">
            ✕ Remove
          </button>
        </div>

        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label small fw-semibold text-uppercase text-muted">Full Name</label>
            <input [(ngModel)]="p.passengerName" type="text"
                   class="form-control" placeholder="Enter full name" />
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-semibold text-uppercase text-muted">Age</label>
            <input [(ngModel)]="p.passengerAge" type="number"
                   class="form-control" placeholder="Age" min="1" />
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold text-uppercase text-muted">Seat No</label>
            <input [(ngModel)]="p.seatNo" type="text"
                   class="form-control" placeholder="e.g. A1" />
          </div>
        </div>
      </div>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-outline-dark fw-semibold" (click)="addPassenger()">
        + Add Passenger
      </button>
      <button class="btn btn-dark fw-bold flex-grow-1" (click)="confirm()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Confirming...' : '🎟 Confirm Booking' }}
      </button>
    </div>

  </div>
</div>
