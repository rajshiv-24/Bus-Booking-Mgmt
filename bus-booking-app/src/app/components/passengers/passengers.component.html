<div class="page-container">

  <div class="mb-4">
    <a routerLink="/my-bookings" class="text-decoration-none text-muted small">
      ← Back to My Bookings
    </a>
    <h3 class="fw-bold mt-2">Passengers</h3>
    <p class="text-muted small">Booking #{{ bookingId }}</p>
  </div>

  <!-- Loading -->
  <div class="text-center py-5" *ngIf="loading">
    <div class="spinner-border text-dark"></div>
    <p class="mt-2 text-muted">Loading passengers...</p>
  </div>

  <!-- Error -->
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <!-- Empty -->
  <div class="text-center py-5" *ngIf="!loading && passengers.length === 0 && !error">
    <p class="text-muted">No passengers found for this booking.</p>
  </div>

  <!-- Passenger Cards -->
  <div class="row g-3" *ngIf="!loading && passengers.length > 0">
    <div class="col-md-6" *ngFor="let p of passengers; let i = index">
      <div class="card shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-dark text-warning fw-bold d-flex align-items-center
                      justify-content-center flex-shrink-0"
               style="width:52px; height:52px; font-size:1.3rem;">
            {{ p.passengerName.charAt(0).toUpperCase() }}
          </div>
          <div>
            <div class="fw-bold text-dark">{{ p.passengerName }}</div>
            <div class="text-muted small mt-1">
              Age: {{ p.passengerAge }} &nbsp;|&nbsp;
              <span class="badge bg-warning text-dark">Seat {{ p.seatNo }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
